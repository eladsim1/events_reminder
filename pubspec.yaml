name: events_app
description: "אפליקציית תזכורות לאירועים משמחים – ימי הולדת, ימי נישואין ועוד"
publish_to: 'none'
# versionCode חייב להישאר מעל 4001.
#
# ב-23/09/2026 נבנו כאן קובצי --split-per-abi, ו-Flutter מוסיף להם 1000 לכל
# ABI: 1001 ל-armeabi-v7a, 2001 ל-arm64-v8a, 4001 ל-x86_64. אם אחד מהם הותקן
# אי פעם על טלפון, בנייה אוניברסלית ב-+1 היא **שדרוג לאחור** ואנדרואיד מסרב
# לה – עם אותה הודעה סתומה שמקבלים על קובץ פגום. 5000 עובר את כולם.
version: 1.1.0+5000

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Database
  sqflite: ^2.3.3
  path: ^1.9.0

  # Notifications
  # 17.x מקומפל מול compileSdk 34 עם AGP 7.3 ואינו נבנה מול הטולצ'יין הנוכחי.
  flutter_local_notifications: ^22.0.0
  timezone: ^0.11.0

  # Hebrew calendar
  kosher_dart: ^2.0.16

  # Import/Export
  # 8.x מקומפל מול compileSdk 34 ונדחה ע"י flutter_plugin_android_lifecycle.
  file_picker: ^11.0.0
  url_launcher: ^6.3.2
  path_provider: ^2.1.6
  workmanager: ^0.10.9
  share_plus: ^12.0.2

  # הרשאות ההתראות מתבקשות דרך flutter_local_notifications עצמו
  # (requestNotificationsPermission / requestExactAlarmsPermission),
  # ולכן אין צורך ב-permission_handler.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # מריץ sqflite אמיתי על ה-VM כדי שאפשר יהיה לבדוק את שכבת מסד הנתונים
  # ללא מכשיר אנדרואיד.
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/app_icon.png
